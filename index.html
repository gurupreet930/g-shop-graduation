<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Graduation Store 2026 🎓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #f8fafc; }
        .product-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-24">

    <header class="bg-black text-white p-5 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter italic">GRAD-SHOP USA 🇺🇸</h1>
            <div class="relative">
                <span class="bg-red-600 text-[10px] absolute -top-2 -right-2 px-1.5 rounded-full font-bold">2</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
        </div>
    </header>

    <div class="bg-blue-600 text-white p-8 text-center">
        <h2 class="text-3xl font-extrabold">Class of 2026 Specials</h2>
        <p class="mt-2 opacity-90 text-sm italic">Fast Shipping to all USA States 🚚</p>
    </div>

    <div class="max-w-4xl mx-auto p-4 grid grid-cols-1 gap-6 sm:grid-cols-2 mt-4">
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden product-card">
            <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600" class="w-full h-64 object-cover">
            <div class="p-5">
                <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-2 py-1 rounded uppercase">Must Have</span>
                <h3 class="text-lg font-bold mt-2 text-gray-800">Deluxe Graduation Gown Set</h3>
                <div class="flex justify-between items-center mt-4">
                    <span class="text-2xl font-black text-gray-900">$39.99</span>
                    <button class="bg-black text-white px-6 py-2 rounded-full font-bold text-sm">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden product-card">
            <img src="https://images.unsplash.com/photo-1627556704302-624286467c65?w=600" class="w-full h-64 object-cover">
            <div class="p-5">
                <span class="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-1 rounded uppercase">Custom</span>
                <h3 class="text-lg font-bold mt-2 text-gray-800">Premium 'Class of 2026' Sash</h3>
                <div class="flex justify-between items-center mt-4">
                    <span class="text-2xl font-black text-gray-900">$14.99</span>
                    <button class="bg-black text-white px-6 py-2 rounded-full font-bold text-sm">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center z-50">
        <div>
            <p class="text-[10px] text-gray-400 uppercase font-bold">Total (2 items)</p>
            <p class="text-xl font-black text-blue-600">$54.98</p>
        </div>
        <button class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black shadow-lg shadow-blue-200 active:bg-blue-700 transition-colors">
            CHECKOUT NOW
        </button>
    </div>

    <footer class="text-center p-12 text-gray-400 text-[10px] uppercase tracking-widest">
        <p>© 2026 Graduation USA Store</p>
        <p class="mt-2 text-blue-400">Bhilai to California Express</p>
    </footer>

</body>
</html>
