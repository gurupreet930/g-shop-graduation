<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G SHOP | USA Graduation Specials 🎓</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 pb-24">

    <header class="bg-black text-white p-5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-black tracking-tighter italic text-yellow-400">G SHOP 🇺🇸</h1>
        <div class="bg-white text-black px-4 py-1 rounded-full text-xs font-bold shadow-md">Cart (2)</div>
    </header>

    <div class="bg-blue-700 text-white p-12 text-center shadow-inner">
        <h2 class="text-4xl font-black uppercase tracking-tight">Class of 2026</h2>
        <p class="mt-2 text-sm font-bold opacity-90 italic">Premium Graduation Gear • Fast USA Shipping</p>
    </div>

    <main class="max-w-md mx-auto p-4 space-y-8 mt-4">
        
        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-blue-100 border border-slate-100 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=600" class="w-full h-80 object-cover">
            <div class="p-8 text-center">
                <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-3 py-1 rounded-full uppercase tracking-widest text-center block w-max mx-auto">Top Rated</span>
                <h3 class="text-2xl font-black mt-3 text-slate-800 text-center">Deluxe Gown & Cap Set</h3>
                <p class="text-slate-500 text-sm mt-1 font-medium italic text-center">Official 2026 Graduation Set</p>
                <div class="flex flex-col items-center mt-6">
                    <span class="text-3xl font-black text-slate-900 mb-4">$39.99</span>
                    <button class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg active:scale-95 transition-all shadow-xl">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-blue-100 border border-slate-100 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1627556704302-624286467c65?w=600" class="w-full h-80 object-cover">
            <div class="p-8 text-center">
                <span class="text-[10px] font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full uppercase tracking-widest text-center block w-max mx-auto">Custom Style</span>
                <h3 class="text-2xl font-black mt-3 text-slate-800 text-center">Premium 2026 Sash</h3>
                <p class="text-slate-500 text-sm mt-1 font-medium italic text-center">High-Quality Gold Embroidery</p>
                <div class="flex flex-col items-center mt-6">
                    <span class="text-3xl font-black text-slate-900 mb-4">$14.99</span>
                    <button class="w-full bg-black text-white py-4 rounded-2xl font-bold text-lg active:scale-95 transition-all shadow-xl">Add to Cart</button>
                </div>
            </div>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-6 shadow-2xl flex justify-between items-center z-50">
        <div>
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Total Amount</p>
            <p class="text-2xl font-black text-blue-700">$54.98</p>
        </div>
        <button class="bg-blue-700 text-white px-10 py-4 rounded-2xl font-black shadow-lg shadow-blue-200 active:bg-blue-800 transition-colors">
            CHECKOUT
        </button>
    </div>

    <footer class="text-center p-20 text-slate-400 text-[10px] uppercase tracking-[0.2em] font-bold">
        <p>© 2026 G SHOP USA</p>
        <p class="mt-2 text-blue-400 italic">Global Success from Bhilai 🌍</p>
    </footer>

</body>
</html>
